<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today's weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1B2433;
    --panel: #232E40;
    --ink: #EEF1F5;
    --muted: #93A0B4;
    --rule: #34415A;
    --num: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
    --text: "Instrument Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--text);
    --gap: 3vh;
    padding: max(var(--gap), env(safe-area-inset-top)) var(--gap) max(var(--gap), env(safe-area-inset-bottom));
    display: grid; grid-template-columns: minmax(0, 1fr) 35%; grid-template-rows: 1fr 1fr; grid-template-areas: "now week" "today week"; gap: var(--gap);
    overflow: hidden;
  }

  /* Left column: now (top half) and today (bottom half). Right column: 7-day, full height. */
  .panel { background: var(--panel); border-radius: 22px; min-height: 0; }

  /* Top-left box: two equal halves, each centered both ways */
  .now { grid-area: now; display: grid; grid-template-columns: 1fr 1px 1fr; align-items: stretch; }
  .now-divider { background: var(--rule); margin: 4vh 0; }
  .block { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4.6vh; padding: 2vh 1vw; }
  .block-label { font-size: min(2.8vh, 1.8vw); font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: .45em; }
  .live { width: .62em; height: .62em; border-radius: 50%; background: #5DB85C; box-shadow: 0 0 0 .22em rgba(93,184,92,.25); }
  .big { font-family: var(--num); font-weight: 800; line-height: .8; font-size: min(24vh, 11vw); letter-spacing: -.01em; white-space: nowrap; }
  .big sup { font-size: .36em; vertical-align: top; position: relative; top: .1em; font-weight: 500; color: var(--muted); margin-left: .04em; }
  .now-row { display: flex; align-items: flex-start; justify-content: center; gap: .8vw; }
  .now-icon { width: min(9vh, 5.5vw); height: min(9vh, 5.5vw); flex: none; margin-top: calc((min(24vh, 11vw) * .8 - min(9vh, 5.5vw)) / 2); }
  .block-sub { font-size: min(3vh, 1.9vw); color: var(--muted); }
  .block-sub b { color: var(--ink); font-weight: 600; }

  /* Bottom-left box: today's low to high, centered */
  .today { grid-area: today; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4vh; padding: 1vh 2vw 7vh; }
  .today-head { display: flex; align-items: center; justify-content: center; gap: 1.2vw; font-size: min(5.2vh, 3.2vw); line-height: 1; }
  .today-head b { font-weight: 700; }
  .today-head span { color: var(--muted); }
  .today-rain { color: #8FB8E8; font-weight: 600; font-size: min(3vh, 1.9vw); margin-top: -1.2vh; }
  .today-icon { width: min(9vh, 5.5vw); height: min(9vh, 5.5vw); flex: none; }
  .today-temps { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; column-gap: 3vw; width: 100%; }
  .t-temp { display: flex; flex-direction: column; align-items: center; line-height: .85; }
  .t-temp:first-child { justify-self: end; }
  .t-temp:last-child { justify-self: start; }
  .t-temp > span { color: var(--muted); font-size: min(3.2vh, 2vw); font-weight: 600; margin-bottom: 1.2vh; }
  .t-temp b { font-family: var(--num); font-weight: 800; font-size: min(28vh, 13vw); padding-left: .12em; }
  .uv { font-style: normal; font-size: min(3vh, 1.9vw); font-weight: 700; line-height: 1; display: inline-flex; align-items: center; gap: .35em; white-space: nowrap; }
  .t-temp .uv { margin-top: 1.6vh; }
  .big-wrap { display: flex; flex-direction: column; align-items: center; gap: 1.6vh; }
  .ghost { visibility: hidden; }
  .t-arrow { width: min(11vh, 6.5vw); height: auto; }

  .week { grid-area: week; padding: 3vh 2vw; display: flex; flex-direction: column; }
  .week-title { font-size: min(2.8vh, 1.9vw); color: var(--muted); font-weight: 500; text-align: center; line-height: 1; padding-bottom: 1.6vh; }
  .week-title b { color: var(--ink); font-weight: 600; }
  .wk-rows { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .wk-row { flex: 1; display: grid; grid-template-columns: 3.3em 2.3em 2em minmax(3em, 1fr) 2em; align-items: center; gap: .7vw; font-size: min(3vh, 1.9vw); line-height: 1; border-top: 1px solid var(--rule); }
  .wk-day { font-weight: 600; }
  .wk-icon { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: .15em; }
  .wk-icon svg { width: 2.2em; height: 2.2em; display: block; }
  .wk-icon.rain { transform: translateY(-.13em); }
  .wk-icon em { font-style: normal; font-size: .6em; color: #8FB8E8; font-weight: 600; white-space: nowrap; line-height: 1; }
  .wk-lo, .wk-hi { font-family: var(--num); font-weight: 700; font-size: 1.25em; text-align: right; }
  .wk-lo { color: var(--muted); }
  .wk-bar { position: relative; height: .36em; border-radius: 1em; background: #34415A; }
  .wk-fill { position: absolute; top: 0; bottom: 0; border-radius: 1em; }
  .dot { position: absolute; top: 50%; width: .62em; height: .62em; margin: -.31em 0 0 -.31em; border-radius: 50%; background: #EEF1F5; border: 2px solid var(--panel); }

  .msg { grid-row: 1 / -1; align-self: center; justify-self: center; font-size: 3vh; color: var(--muted); text-align: center; max-width: 40ch; line-height: 1.4; }

  @media (orientation: portrait) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; grid-template-areas: "now" "today" "week"; }
    .big, .t-temp b { font-size: 13vh; }
    .block-sub, .block-label, .today-head { font-size: 2.2vh; }
    .wk-row { font-size: 2.4vh; }
  }
</style>
</head>
<body>
  <div class="msg" id="loading">Loading forecast…</div>

<script>
/* ---------- Settings: change these if you move the display ---------- */
const PLACE = "La Mirada";
const LAT = 33.9172, LON = -118.0120;
const TZ = "America/Los_Angeles";
const REFRESH_MIN = 5;                  // minutes between forecast checks

/* -------------------------------------------------------------------- */

const URL_API = "https://api.open-meteo.com/v1/forecast"
  + `?latitude=${LAT}&longitude=${LON}`
  + "&current=temperature_2m,apparent_temperature,weather_code,is_day,uv_index"
  + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max"
  + `&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=${encodeURIComponent(TZ)}&forecast_days=7`;

const CODES = {0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Cloudy",45:"Fog",48:"Freezing fog",
  51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",56:"Light freezing drizzle",57:"Freezing drizzle",
  61:"Light rain",63:"Rain",65:"Heavy rain",66:"Light freezing rain",67:"Freezing rain",
  71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow grains",80:"Light showers",81:"Showers",82:"Heavy showers",
  85:"Light snow showers",86:"Heavy snow showers",95:"Thunderstorms",96:"Thunderstorms with hail",99:"Thunderstorms with heavy hail"};

// Temperature to color: cold blue through mild green to hot orange-red
const STOPS = [[35,"#7A9FE8"],[50,"#86C3E0"],[62,"#9BD3A0"],[72,"#EBCB5E"],[82,"#F0964A"],[95,"#DE5A3C"]];
function hex(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));}
function tempColor(t){
  if (t<=STOPS[0][0]) return STOPS[0][1];
  for (let i=1;i<STOPS.length;i++){
    if (t<=STOPS[i][0]){
      const [t0,c0]=STOPS[i-1],[t1,c1]=STOPS[i],f=(t-t0)/(t1-t0),a=hex(c0),b=hex(c1);
      return "rgb("+a.map((v,k)=>Math.round(v+(b[k]-v)*f)).join(",")+")";
    }
  }
  return STOPS[STOPS.length-1][1];
}

/* ---------- Weather icons (drawn in a 64x64 box) ---------- */
const CLOUD = "M20 46H45A9 9 0 0 0 46 28A13 13 0 0 0 21.5 25A10.5 10.5 0 0 0 20 46Z";
function sunG(cx,cy,r){ let rays=""; for(let k=0;k<8;k++){ const a=k*Math.PI/4, x1=cx+Math.cos(a)*(r+4), y1=cy+Math.sin(a)*(r+4), x2=cx+Math.cos(a)*(r+9), y2=cy+Math.sin(a)*(r+9);
  rays+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`; }
  return `<g stroke="#F2C14E" stroke-width="3.5" stroke-linecap="round">${rays}</g><circle cx="${cx}" cy="${cy}" r="${r}" fill="#F2C14E"/>`; }
function moonG(cx,cy,r){ return `<path d="M${cx+r*.35} ${cy-r} A${r} ${r} 0 1 0 ${cx+r} ${cy+r*.45} A${r*.8} ${r*.8} 0 0 1 ${cx+r*.35} ${cy-r}Z" fill="#D9DEE8"/>`; }
function cloudG(dy=0, fill="#C9D3E0"){ return `<path d="${CLOUD}" transform="translate(0 ${dy})" fill="${fill}"/>`; }
// Pieces drawn under the cloud: n marks spread across the icon
function marks(n, draw, span=24, mid=32){ let out=""; for (let k=0;k<n;k++){ const x = n===1 ? mid : mid-span/2 + k*(span/(n-1)); out+=draw(x,k); } return out; }
const RAIN="#8FB8E8", HEAVY="#5E97DB", ICE="#CFE6FF";
function drops(n, color, heavy, span, mid){ return `<g stroke="${color}" stroke-width="${heavy?4.2:3.4}" stroke-linecap="round">${marks(n,(x,k)=>`<line x1="${x+3}" y1="${heavy?42:43}" x2="${x-2}" y2="${heavy?58:54}"/>`, span, mid)}</g>`; }
function dots(n, color, span, mid){ return `<g fill="${color}">${marks(n,(x,k)=>`<circle cx="${x}" cy="${k%2?52:47}" r="2.4"/>`, span, mid)}</g>`; }
function flake(x,y,r,color){ let l=""; for (let a=0;a<3;a++){ const t=a*Math.PI/3, dx=Math.cos(t)*r, dy=Math.sin(t)*r; l+=`<line x1="${(x-dx).toFixed(1)}" y1="${(y-dy).toFixed(1)}" x2="${(x+dx).toFixed(1)}" y2="${(y+dy).toFixed(1)}"/>`; } return `<g stroke="${color}" stroke-width="2.4" stroke-linecap="round">${l}</g>`; }
function flakes(n){ return marks(n,(x,k)=>flake(x, k%2?54:46, n>3?3.8:4.2, "#EEF1F5"), n>3?34:24); }
function hail(n){ return `<g fill="#EEF1F5">${marks(n,(x,k)=>`<circle cx="${x}" cy="${k%2?55:50}" r="2.6"/>`)}</g>`; }
function sunOrMoon(isDay, x, y, r){ return isDay ? sunG(x,y,r) : moonG(x,y,r+1); }
// Cloud with something peeking out behind it (used for "showers": on-and-off rain with breaks)
function peekCloud(isDay){ return sunOrMoon(isDay,21,15,7) + `<g transform="translate(4 -6) scale(.92)">${cloudG(0)}</g>`; }
const DARK="#9AA6B8";

// One distinct icon per forecast type (WMO weather codes used by Open-Meteo)
function iconSVG(code, isDay){
  let g="";
  switch (code){
    case 0: g = isDay ? sunG(32,32,11) : moonG(30,32,14); break;                                   // Clear
    case 1: g = (isDay ? sunG(28,28,10) : moonG(28,28,12)) + `<g transform="translate(22 26) scale(.55)">${cloudG(0)}</g>`; break; // Mostly clear
    case 2: g = (isDay ? sunG(24,22,8) : moonG(24,22,9)) + `<g transform="translate(6 7) scale(.88)">${cloudG()}</g>`; break; // Partly cloudy
    case 3: g = `<g transform="translate(-6 -8) scale(.8)">${cloudG(0,DARK)}</g>` + `<g transform="translate(4 2)">${cloudG(0)}</g>`; break; // Cloudy
    case 45: case 48: g = cloudG(-10,"#AEB8C7") + `<g stroke="#C9D3E0" stroke-width="3.5" stroke-linecap="round"><line x1="14" y1="45" x2="50" y2="45"/><line x1="18" y1="53" x2="46" y2="53"/></g>`; break; // Fog
    case 51: g = cloudG(-8) + dots(2, RAIN); break;                       // Light drizzle
    case 53: g = cloudG(-8) + dots(3, RAIN); break;                       // Drizzle
    case 55: g = cloudG(-8) + dots(5, RAIN); break;                       // Heavy drizzle
    case 56: case 57: g = cloudG(-8) + dots(code===56?2:3, ICE, 14, 25) + flake(45,50,4,ICE); break; // Freezing drizzle
    case 61: g = cloudG(-8) + drops(2, RAIN); break;                      // Light rain
    case 63: g = cloudG(-8) + drops(3, RAIN); break;                      // Rain
    case 65: g = cloudG(-10, DARK) + drops(4, HEAVY, true); break;        // Heavy rain
    case 66: case 67: g = cloudG(-8) + drops(code===66?2:3, ICE, false, 14, 24) + flake(45,50,4,ICE); break; // Freezing rain
    case 71: g = cloudG(-8) + flakes(2); break;                           // Light snow
    case 73: g = cloudG(-8) + flakes(3); break;                           // Snow
    case 75: g = cloudG(-10, DARK) + flakes(4); break;                    // Heavy snow
    case 77: g = cloudG(-8) + `<g fill="#EEF1F5">${marks(4,(x,k)=>`<circle cx="${x}" cy="${k%2?52:47}" r="1.6"/>`)}</g>`; break; // Snow grains
    case 80: g = peekCloud(isDay) + drops(2, RAIN); break;                // Light showers
    case 81: g = peekCloud(isDay) + drops(3, RAIN); break;                // Showers
    case 82: g = peekCloud(isDay) + drops(4, HEAVY, true); break;         // Heavy showers
    case 85: g = peekCloud(isDay) + flakes(2); break;                     // Light snow showers
    case 86: g = peekCloud(isDay) + flakes(4); break;                     // Heavy snow showers
    case 95: g = cloudG(-10, DARK) + `<path d="M35 38L27 50H33L29 60L41 46H35L38 38Z" fill="#F2C14E"/>`; break; // Thunderstorms
    case 96: case 99: g = cloudG(-10, DARK) + `<path d="M35 38L27 50H33L29 60L41 46H35L38 38Z" fill="#F2C14E"/>` + `<g fill="#EEF1F5"><circle cx="20" cy="50" r="2.6"/><circle cx="47" cy="52" r="2.6"/>${code===99?`<circle cx="22" cy="58" r="2.6"/><circle cx="45" cy="59" r="2.6"/>`:""}</g>`; break; // Thunderstorms with hail
    default: g = cloudG(-3);
  }
  return `<g class="wx">${g}</g>`;
}
let data = null, lastOk = null, lastErr = false;
try { const c = JSON.parse(localStorage.getItem("wx")); if (c) { data = c.data; lastOk = new Date(c.at); } } catch(e) {}

function nowParts(){
  const p = new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour12:false,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).formatToParts(new Date());
  const g = k => p.find(x=>x.type===k).value;
  return { date:`${g("year")}-${g("month")}-${g("day")}`, hour: Number(g("hour"))%24, minute: Number(g("minute")) };
}

async function load(){
  try {
    const r = await fetch(URL_API, {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    data = await r.json(); lastOk = new Date(); lastErr = false;
    try { localStorage.setItem("wx", JSON.stringify({data, at:lastOk.toISOString()})); } catch(e) {}
  } catch(e) { lastErr = true; }
  render();
}

// UV badge: sun outline + "UV n", colored by the standard UV index scale
function uvLevelColor(u){ if (u<=2) return "#5DB85C"; if (u<=5) return "#EBD44A"; if (u<=7) return "#F0913A"; if (u<=10) return "#E5574A"; return "#A98BEA"; }
function uvBadge(u, ghost){
  if (u==null) return "";
  return `<em class="uv${ghost?" ghost":""}" style="color:${uvLevelColor(u)}"><span>(UV ${u})</span></em>`;
}

function weekday(dateStr){ const [y,m,d]=dateStr.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)).toLocaleDateString("en-US",{weekday:"short",timeZone:"UTC"}); }

// Line under "Today": the kind of wet weather expected, with its chance
function todayLine(code, p){
  const wet = code>=51 && code!==77;
  if (wet) return `<div class="today-rain">${CODES[code]||"Rain"}${p>0?`, ${p}% chance`:""}</div>`;
  if (p>=20) return `<div class="today-rain">${p}% chance of rain</div>`;
  return "";
}

// Today, big: low to high
function todayHTML(np){
  const d=data.daily; let i=d.time.indexOf(np.date); if (i<0) i=0;
  const uvMax = d.uv_index_max && d.uv_index_max[i]!=null ? Math.round(d.uv_index_max[i]) : null;
  const tLo=d.temperature_2m_min[i], tHi=d.temperature_2m_max[i], p=d.precipitation_probability_max[i] ?? 0, code=d.weather_code?d.weather_code[i]:3;
  const [y,m,dd]=d.time[i].split("-").map(Number);
  const wd=new Date(Date.UTC(y,m-1,dd)).toLocaleDateString("en-US",{weekday:"long",timeZone:"UTC"});
  return `<section class="today panel">
    <div class="today-head"><svg class="today-icon" viewBox="0 0 64 64" aria-hidden="true">${iconSVG(d.weather_code?d.weather_code[i]:3,1)}</svg><b>Today</b></div>
    ${todayLine(code, p)}
    <div class="today-temps">
      <div class="t-temp"><span>Low</span><b style="color:${tempColor(tLo)}"><span class="digits">${Math.round(tLo)}</span>°</b>${uvBadge(uvMax, true)}</div>
      <svg class="t-arrow" viewBox="0 0 120 40" aria-hidden="true"><defs><linearGradient id="ag" x1="0" x2="1"><stop offset="0" stop-color="${tempColor(tLo)}"/><stop offset="1" stop-color="${tempColor(tHi)}"/></linearGradient></defs><path d="M6 20H104M88 6L106 20L88 34" fill="none" stroke="url(#ag)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="t-temp"><span>High</span><b style="color:${tempColor(tHi)}"><span class="digits">${Math.round(tHi)}</span>°</b>${uvBadge(uvMax)}</div>
    </div>
  </section>`;
}

// 7-day list, styled like a phone weather app: day, icon, rain chance, low, range bar, high
function weekHTML(np, curTemp){
  const d=data.daily, n=Math.min(7,d.time.length);
  const lows=d.temperature_2m_min.slice(0,n), highs=d.temperature_2m_max.slice(0,n);
  const wMin=Math.min(...lows), wMax=Math.max(...highs), span=Math.max(1,wMax-wMin);
  let rows="";
  for (let i=0;i<n;i++){
    const lo=lows[i], hi=highs[i], p=d.precipitation_probability_max[i] ?? 0;
    const left=(lo-wMin)/span*100, width=Math.max(2,(hi-lo)/span*100);
    const grad=`linear-gradient(90deg, ${tempColor(lo)}, ${tempColor((lo+hi)/2)}, ${tempColor(hi)})`;
    const dot = i===0 && d.time[0]===np.date ? `<i class="dot" style="left:${Math.min(100,Math.max(0,(curTemp-wMin)/span*100))}%"></i>` : "";
    rows+=`<div class="wk-row">
      <span class="wk-day">${i===0 && d.time[0]===np.date ? "Today" : weekday(d.time[i])}</span>
      <span class="wk-icon${p>=20?" rain":""}"><svg viewBox="0 0 64 64" aria-hidden="true">${iconSVG(d.weather_code ? d.weather_code[i] : 3, 1)}</svg>${p>=20?`<em>${p}%</em>`:""}</span>
      <span class="wk-lo">${Math.round(lo)}°</span>
      <span class="wk-bar"><span class="wk-fill" style="left:${left}%;width:${width}%;background:${grad}"></span>${dot}</span>
      <span class="wk-hi">${Math.round(hi)}°</span>
    </div>`;
  }
  return `<section class="week panel"><div class="week-title"><b>7-day</b> forecast</div><div class="wk-rows">${rows}</div></section>`;
}

function render(){
  const np = nowParts();
  if (!data){ document.body.innerHTML=`<div class="msg">Can't reach the forecast service. Check the tablet's Wi-Fi; it will retry every ${REFRESH_MIN} minutes.</div>`; return; }

  const c=data.current;
  const uvNow = c.uv_index!=null ? Math.round(c.uv_index) : null;
  const tp = new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit"}).formatToParts(new Date());
  const tv = k => (tp.find(x=>x.type===k)||{}).value || "";
  const timeHTML = `${tv("hour")}:${tv("minute")}<sup>${tv("dayPeriod")}</sup>`;
  const wd = new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"long"}).format(new Date());
  const md = new Intl.DateTimeFormat("en-US",{timeZone:TZ,month:"long",day:"numeric"}).format(new Date());

  document.body.innerHTML = `
    <section class="now panel">
      <div class="block">
        <div class="block-label"><i class="live"></i>Right now</div>
        <div class="now-row"><div class="big-wrap"><div class="big" style="color:${tempColor(c.temperature_2m)}"><span class="digits">${Math.round(c.temperature_2m)}</span><sup>°F</sup></div>${uvBadge(uvNow)}</div><svg class="now-icon" viewBox="0 0 64 64" aria-hidden="true">${iconSVG(c.weather_code, c.is_day)}</svg></div>
        <div class="block-sub"><b>${CODES[c.weather_code]||"—"}</b>, feels like ${Math.round(c.apparent_temperature)}°</div>
      </div>
      <div class="now-divider"></div>
      <div class="block">
        <div class="block-label">${wd}</div>
        <div class="big-wrap"><div class="big">${timeHTML}</div>${uvBadge(uvNow, true)}</div>
        <div class="block-sub">${md}</div>
      </div>
    </section>
    ${todayHTML(np)}
    ${weekHTML(np, c.temperature_2m)}`;
  centerIcons();
  alignTodayHead();
  centerUV();
}

// Line up the visible middle of the "Today" icon + word with the visible middle of the arrow
function alignTodayHead(){
  try {
    const head=document.querySelector(".today-head"), arrow=document.querySelector(".t-arrow");
    const icon=head.querySelector(".today-icon"), g=icon.querySelector("g.wx"), word=head.querySelector("b");
    head.style.transform="";
    const ar=arrow.getBoundingClientRect(), ab=arrow.querySelector("path").getBBox();
    const arrowMid=ar.left+(ab.x+ab.width/2)*(ar.width/120);
    const ir=icon.getBoundingClientRect(), ib=g.getBBox(), k=ir.width/64;
    const iconLeft=ir.left+(32-ib.width/2-1.75)*k;
    const rg=document.createRange(); rg.selectNodeContents(word); const wordRight=rg.getBoundingClientRect().right;
    head.style.transform=`translateX(${(arrowMid-(iconLeft+wordRight)/2).toFixed(1)}px)`;
  } catch(e) {}
}

function centerUV(){
  document.querySelectorAll(".uv:not(.ghost)").forEach(b=>{
    try {
      const d=b.parentElement.querySelector(".digits"); if (!d) return;
      b.style.transform="";
      const dr=d.getBoundingClientRect(), br=b.getBoundingClientRect();
      b.style.transform=`translateX(${((dr.left+dr.width/2)-(br.left+br.width/2)).toFixed(1)}px)`;
    } catch(e) {}
  });
}

function centerIcons(){
  document.querySelectorAll("g.wx").forEach(g=>{
    try { const b=g.getBBox(); g.setAttribute("transform",`translate(${(32-(b.x+b.width/2)).toFixed(2)} ${(32-(b.y+b.height/2)).toFixed(2)})`); } catch(e) {}
  });
}

async function keepAwake(){ try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch(e) {} }
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden){ keepAwake(); load(); } });

window.addEventListener("resize", ()=>{ if (data) render(); });
keepAwake();
if (data) render();
load();
setInterval(load, REFRESH_MIN*60000);
let lastMinute="";
setInterval(()=>{ const m=new Date().getMinutes(); if (data && m!==lastMinute){ lastMinute=m; render(); } }, 1000);
</script>
